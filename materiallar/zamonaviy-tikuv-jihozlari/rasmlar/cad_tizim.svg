<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="CAD tizimi"><title>CAD tizimi</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><rect x="30" y="120" width="205" height="280" rx="16" fill="#fbf8f3" stroke="#dccbb0" stroke-width="2"/><text x="132" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2b3a">Digitayzer</text><text x="132" y="378" text-anchor="middle" font-size="14.5" fill="#33475b">andazani kiritish</text><line x1="240" y1="230" x2="288" y2="230" stroke="#e4572e" stroke-width="4" marker-end="url(#arc)"/><rect x="265" y="120" width="205" height="280" rx="16" fill="#fbf8f3" stroke="#dccbb0" stroke-width="2"/><text x="367" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2b3a">Kompyuter (CAD)</text><text x="367" y="378" text-anchor="middle" font-size="14.5" fill="#33475b">konstruksiya, gradatsiya, ukladka</text><line x1="475" y1="230" x2="523" y2="230" stroke="#e4572e" stroke-width="4" marker-end="url(#arc)"/><rect x="500" y="120" width="205" height="280" rx="16" fill="#fbf8f3" stroke="#dccbb0" stroke-width="2"/><text x="602" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2b3a">Plotter</text><text x="602" y="378" text-anchor="middle" font-size="14.5" fill="#33475b">ukladkani chop etish</text><line x1="710" y1="230" x2="758" y2="230" stroke="#e4572e" stroke-width="4" marker-end="url(#arc)"/><rect x="735" y="120" width="205" height="280" rx="16" fill="#fbf8f3" stroke="#dccbb0" stroke-width="2"/><text x="837" y="350" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2b3a">Avtomatik bichish</text><text x="837" y="378" text-anchor="middle" font-size="14.5" fill="#33475b">matoni qirqish (CAM)</text><rect x="60" y="180" width="145" height="110" rx="8" fill="#c9d3dc" stroke="#33475b" stroke-width="2"/><path d="M90 200 L170 205 L180 270 L100 275 Z" fill="#fff" stroke="#dccbb0"/><path d="M150 240 l22 -8 l10 18 l-22 10 z" fill="#41566b"/><circle cx="158" cy="246" r="5" fill="#e4572e"/><rect x="290" y="170" width="155" height="100" rx="8" fill="#41566b"/><rect x="298" y="178" width="139" height="84" fill="#eaf4f3"/><path d="M335 190 L375 188 L385 250 L327 252 Z" fill="none" stroke="#1b998b" stroke-width="2.5"/><path d="M390 195 L425 195 L425 248 L395 248 Z" fill="none" stroke="#e4572e" stroke-width="2.5"/><rect x="357" y="270" width="20" height="22" fill="#41566b"/><rect x="335" y="292" width="64" height="8" rx="3" fill="#41566b"/><rect x="515" y="185" width="175" height="55" rx="10" fill="#9aabb9" stroke="#33475b" stroke-width="2"/><rect x="530" y="240" width="145" height="60" fill="#fff" stroke="#dccbb0"/><path d="M545 255 l30 0 l5 35 l-35 0 z M600 252 l40 4 l-4 34 l-34 -2z" fill="none" stroke="#1d2b3a" stroke-width="1.6"/><line x1="535" y1="300" x2="530" y2="320" stroke="#33475b" stroke-width="5"/><line x1="670" y1="300" x2="675" y2="320" stroke="#33475b" stroke-width="5"/><rect x="750" y="230" width="175" height="60" rx="6" fill="#dccbb0" stroke="#33475b" stroke-width="2"/><rect x="750" y="196" width="175" height="16" rx="4" fill="#9aabb9" stroke="#33475b"/><rect x="820" y="186" width="34" height="40" rx="5" fill="#41566b"/><line x1="837" y1="226" x2="837" y2="250" stroke="#e4572e" stroke-width="4"/><line x1="765" y1="290" x2="765" y2="315" stroke="#33475b" stroke-width="5"/><line x1="910" y1="290" x2="910" y2="315" stroke="#33475b" stroke-width="5"/><text x="480" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#1d2b3a">SAPR/CAD–CAM tizimida maʼlumot oqimi</text><rect x="30" y="430" width="900" height="70" rx="12" fill="#eef6f5" stroke="#1b998b" stroke-width="1.5"/><text x="480" y="462" text-anchor="middle" font-size="17" fill="#1d2b3a">Andaza bir marta raqamlashtiriladi → oʻlchamlar boʻyicha koʻpaytiriladi (gradatsiya)</text><text x="480" y="488" text-anchor="middle" font-size="17" fill="#1d2b3a">→ matoga tejamkor joylashtiriladi → chop etiladi yoki avtomatik qirqiladi</text><text x="480" y="575" text-anchor="middle" font-size="18" fill="#33475b" font-style="italic">8-rasm. Raqamli qurilmalar zanjiri: digitayzer – CAD – plotter – avtomatik bichish</text></svg>