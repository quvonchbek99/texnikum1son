circle cx="360" cy="62" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="360" y="66.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><circle cx="300" cy="150" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="300" y="154.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><circle cx="232" cy="196" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="232" y="200.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><circle cx="244" cy="160" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="244" y="164.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><circle cx="210" cy="240" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="210" y="244.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text><circle cx="201" cy="298" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="201" y="302.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">7</text><circle cx="201" cy="352" r="11" fill="#1d2b3a" stroke="#fff" stroke-width="2"/><text x="201" y="356.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8</text><rect x="726" y="40" width="222" height="420" rx="14" fill="#fbf8f3" stroke="#dccbb0" stroke-width="2"/><text x="740" y="74" font-size="17" font-weight="700" fill="#1d2b3a">Yuqori ipni oʻtkazish</text><text x="740" y="110" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">1.</tspan> Gʻaltak</text><text x="740" y="153" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">2.</tspan> Ip stoykasi yoʻnaltirgichi</text><text x="740" y="196" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">3.</tspan> Yengdagi yoʻnaltirgich</text><text x="740" y="239" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">4.</tspan> Ip taranglagich disklari</text><text x="740" y="282" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">5.</tspan> Ip tortgich koʻzi</text><text x="740" y="325" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">6.</tspan> Pastki yoʻnaltirgichlar</text><text x="740" y="368" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">7.</tspan> Igna tutqich yoʻnaltirgichi</text><text x="740" y="411" font-size="14.5" fill="#1d2b3a"><tspan font-weight="700">8.</tspan> Igna teshigi</text><text x="40" y="505" font-size="16" fill="#1d2b3a">Oldin: panja koʻtariladi (taranglagich disklari ochiladi), ip tortgich maxovik bilan eng yuqoriga keltiriladi.</text><text x="40" y="530" font-size="16" fill="#1d2b3a">Igna teshigiga ip uzun ariqcha tomonidan kiritiladi (yoʻnalish mashina pasportida koʻrsatiladi).</text><text x="480" y="578" text-anchor="middle" font-size="18" fill="#33475b" font-style="italic">13-rasm. Universal tikuv mashinasida yuqori ipni oʻtkazish yoʻli (umumlashtirilgan)</text></svg>