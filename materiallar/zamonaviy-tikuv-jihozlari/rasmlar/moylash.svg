width="1.5"/><text x="420" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b3a">3</text><path d="M560 224 C570 238 571 244 560 250 C549 244 550 238 560 224 Z" fill="#f2a541" stroke="#1d2b3a" stroke-width="1.5"/><text x="560" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b3a">4</text><path d="M182 364 C192 378 193 384 182 390 C171 384 172 378 182 364 Z" fill="#f2a541" stroke="#1d2b3a" stroke-width="1.5"/><text x="182" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b3a">5</text><path d="M600 364 C610 378 611 384 600 390 C589 384 590 378 600 364 Z" fill="#f2a541" stroke="#1d2b3a" stroke-width="1.5"/><text x="600" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2b3a">6</text><text x="700" y="114" font-size="17" fill="#1d2b3a"><tspan font-weight="700">1.</tspan> Igna yuritgich mexanizmi</text><text x="700" y="158" font-size="17" fill="#1d2b3a"><tspan font-weight="700">2.</tspan> Igna va panja sterjenlari</text><text x="700" y="202" font-size="17" fill="#1d2b3a"><tspan font-weight="700">3.</tspan> Yuqori val podshipniklari</text><text x="700" y="246" font-size="17" fill="#1d2b3a"><tspan font-weight="700">4.</tspan> Mato surish mexanizmi</text><text x="700" y="290" font-size="17" fill="#1d2b3a"><tspan font-weight="700">5.</tspan> Moki (ilgak) — har kuni</text><text x="700" y="334" font-size="17" fill="#1d2b3a"><tspan font-weight="700">6.</tspan> Moy vannasi sathi</text><text x="700" y="60" font-size="20" font-weight="700" fill="#1d2b3a">Moylash nuqtalari</text><rect x="40" y="450" width="880" height="70" rx="12" fill="#fff7e8" stroke="#f2a541" stroke-width="2"/><text x="60" y="480" font-size="16.5" fill="#1d2b3a">Faqat ishlab chiqaruvchi tavsiya etgan mashina moyi ishlatiladi. Moylashdan oldin mashina</text><text x="60" y="504" font-size="16.5" fill="#1d2b3a">elektr tarmogʻidan uziladi; ortiqcha moy latta bilan artiladi, sinov choki chiqindi matoda bajariladi.</text><text x="480" y="570" text-anchor="middle" font-size="18" fill="#33475b" font-style="italic">10-rasm. Tikuv mashinasining asosiy moylash nuqtalari (umumlashtirilgan sxema)</text></svg>