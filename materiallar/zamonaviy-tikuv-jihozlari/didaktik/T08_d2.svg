<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Bichish jihozini tanlash algoritmi"><title>Bichish jihozini tanlash algoritmi</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Bichish jihozini tanlash algoritmi</tspan></text><g transform="translate(0 0.0)"><rect x="40" y="78.0" width="880" height="61.0" rx="12" fill="#fbe3dc"/><circle cx="80" cy="108.5" r="21" fill="#e4572e"/><text x="80" y="115.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="116" y="116.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Matoni aniqlash</tspan></text><text x="380" y="105.5" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Tola tarkibi, sirpanchiqlik, choʻziluvchanlik va tukli</tspan><tspan x="380" dy="21.25">yuza baholanadi</tspan></text><rect x="40" y="151.0" width="880" height="61.0" rx="12" fill="#d9f0ed"/><circle cx="80" cy="181.5" r="21" fill="#1b998b"/><text x="80" y="188.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="116" y="189.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Qalinlikni oʻlchash</tspan></text><text x="380" y="189.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">10 qatlam oʻlchanib, natija 10 ga boʻlinadi</tspan></text><rect x="40" y="224.0" width="880" height="61.0" rx="12" fill="#dfe8f6"/><circle cx="80" cy="254.5" r="21" fill="#3d6fb6"/><text x="80" y="261.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="116" y="262.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Balandlikni hisoblash</tspan></text><text x="380" y="262.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">H = n · δ, qogʻoz qatlamlari ham qoʻshiladi</tspan></text><rect x="40" y="297.0" width="880" height="61.0" rx="12" fill="#fdf0d8"/><circle cx="80" cy="327.5" r="21" fill="#f2a541"/><text x="80" y="334.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text><text x="116" y="324.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Pasport bilan</tspan><tspan x="116" dy="25.0">solishtirish</tspan></text><text x="380" y="335.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">H ≤ H_max sharti va texnologik cheklov tekshiriladi</tspan></text><rect x="40" y="370.0" width="880" height="61.0" rx="12" fill="#ece2f5"/><circle cx="80" cy="400.5" r="21" fill="#8e5bb5"/><text x="80" y="407.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">5</text><text x="116" y="408.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Kontur va aniqlik</tspan></text><text x="380" y="397.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Mayda, murakkab detallar tasmali mashinaga</tspan><tspan x="380" dy="22.5">yoʻnaltiriladi</tspan></text><rect x="40" y="443.0" width="880" height="61.0" rx="12" fill="#dcefe3"/><circle cx="80" cy="473.5" r="21" fill="#2f8f5b"/><text x="80" y="480.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">6</text><text x="116" y="481.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Sinov kesimi</tspan></text><text x="380" y="481.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Namunada kesib, detallar andaza bilan solishtiriladi</tspan></text><rect x="40" y="516.0" width="880" height="61.0" rx="12" fill="#fbe3dc"/><circle cx="80" cy="546.5" r="21" fill="#e4572e"/><text x="80" y="553.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">7</text><text x="116" y="554.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Qarorni yozish</tspan></text><text x="380" y="554.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Jihoz, pichoq turi, rejim va asos jadvalga yoziladi</tspan></text></g></svg>