<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Tikuv ishlab chiqarishida sifat nazorati bosqichlari"><title>Tikuv ishlab chiqarishida sifat nazorati bosqichlari</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Tikuv ishlab chiqarishida sifat nazorati bosqichlari</tspan></text><g transform="translate(0 40.0)"><rect x="40" y="78.0" width="880" height="74" rx="12" fill="#fbe3dc"/><circle cx="80" cy="115.0" r="21" fill="#e4572e"/><text x="80" y="122.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="116" y="123.0" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Kirish nazorati</tspan></text><text x="380" y="123.0" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Gazlama, ip va furnitura hujjat bilan solishtiriladi</tspan></text><rect x="40" y="164.0" width="880" height="74" rx="12" fill="#d9f0ed"/><circle cx="80" cy="201.0" r="21" fill="#1b998b"/><text x="80" y="208.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="116" y="209.0" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Bichiqlar nazorati</tspan></text><text x="380" y="209.0" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Detallar nazorat andazasi bilan solishtiriladi</tspan></text><rect x="40" y="250.0" width="880" height="74" rx="12" fill="#dfe8f6"/><circle cx="80" cy="287.0" r="21" fill="#3d6fb6"/><text x="80" y="294.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="116" y="284.0" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Operatsiyalararo</tspan><tspan x="116" dy="25.0">nazorat</tspan></text><text x="380" y="284.0" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Choklar zichligi, tekisligi va ip tarangligi</tspan><tspan x="380" dy="22.5">tekshiriladi</tspan></text><rect x="40" y="336.0" width="880" height="74" rx="12" fill="#fdf0d8"/><circle cx="80" cy="373.0" r="21" fill="#f2a541"/><text x="80" y="380.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text><text x="116" y="381.0" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Yakuniy nazorat</tspan></text><text x="380" y="370.0" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Tayyor buyum oʻlchamlari, simmetriyasi, tashqi</tspan><tspan x="380" dy="22.5">koʻrinishi tekshiriladi</tspan></text><rect x="40" y="422.0" width="880" height="74" rx="12" fill="#ece2f5"/><circle cx="80" cy="459.0" r="21" fill="#8e5bb5"/><text x="80" y="466.0" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">5</text><text x="116" y="467.0" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Qaror</tspan></text><text x="380" y="467.0" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Mos, tuzatishga qaytariladi yoki yaroqsiz deb topiladi</tspan></text></g></svg>