<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Tikuv mashinasining texnik holatini tekshirish algoritmi"><title>Tikuv mashinasining texnik holatini tekshirish algoritmi</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Tikuv mashinasining texnik holatini tekshirish algoritmi</tspan></text><g transform="translate(0 0.0)"><rect x="40" y="78.0" width="880" height="61.0" rx="12" fill="#fbe3dc"/><circle cx="80" cy="108.5" r="21" fill="#e4572e"/><text x="80" y="115.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="116" y="116.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Tayyorgarlik</tspan></text><text x="380" y="105.5" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Pasport, asboblar, nazorat varaqasi; mashina tarmoqdan</tspan><tspan x="380" dy="21.25">uzilgan</tspan></text><rect x="40" y="151.0" width="880" height="61.0" rx="12" fill="#d9f0ed"/><circle cx="80" cy="181.5" r="21" fill="#1b998b"/><text x="80" y="188.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="116" y="189.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Tashqi koʻrik</tspan></text><text x="380" y="189.5" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Himoya moslamalari, kabel, moy darajasi, igna va reyka</tspan></text><rect x="40" y="224.0" width="880" height="61.0" rx="12" fill="#dfe8f6"/><circle cx="80" cy="254.5" r="21" fill="#3d6fb6"/><text x="80" y="261.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="116" y="262.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Qoʻlda aylantirish</tspan></text><text x="380" y="251.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Maxovik oʻz tomonga: erkin aylanish, igna teshik</tspan><tspan x="380" dy="22.5">markazida</tspan></text><rect x="40" y="297.0" width="880" height="61.0" rx="12" fill="#fdf0d8"/><circle cx="80" cy="327.5" r="21" fill="#f2a541"/><text x="80" y="334.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text><text x="116" y="335.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Salt ishlatish</tspan></text><text x="380" y="335.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Panja koʻtarilgan, ipsiz: ovoz, tebranish, moy oqimi</tspan></text><rect x="40" y="370.0" width="880" height="61.0" rx="12" fill="#ece2f5"/><circle cx="80" cy="400.5" r="21" fill="#8e5bb5"/><text x="80" y="407.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">5</text><text x="116" y="408.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Ip va shpulka</tspan></text><text x="380" y="408.5" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Ipni qayta oʻtkazish, shpulka va pastki ip tarangligi</tspan></text><rect x="40" y="443.0" width="880" height="61.0" rx="12" fill="#dcefe3"/><circle cx="80" cy="473.5" r="21" fill="#2f8f5b"/><text x="80" y="480.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">6</text><text x="116" y="481.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Sinov choki</tspan></text><text x="380" y="481.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Ikki qavat matoda chok, qalin joy, chok uzunligi</tspan></text><rect x="40" y="516.0" width="880" height="61.0" rx="12" fill="#fbe3dc"/><circle cx="80" cy="546.5" r="21" fill="#e4572e"/><text x="80" y="553.5" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">7</text><text x="116" y="554.5" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Xulosa</tspan></text><text x="380" y="543.5" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Nosozlik sababi, bajarilgan ish va natijani varaqaga</tspan><tspan x="380" dy="22.5">yozish</tspan></text></g></svg>