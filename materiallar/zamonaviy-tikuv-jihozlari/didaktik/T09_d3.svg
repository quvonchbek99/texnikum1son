ff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="175.6" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Elektr toki</tspan></text><text x="275.24657534246575" y="175.6" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.24657534246575" dy="0">Tok urishi</tspan></text><text x="558.8082191780823" y="175.6" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="558.8082191780823" dy="0">Yerga ulash, kabelni tekshirish</tspan></text><rect x="30" y="189.25" width="900" height="39.75" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="215.35" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Charxlash zarralari</tspan></text><text x="275.24657534246575" y="215.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.24657534246575" dy="0">Koʻz shikastlanishi</tspan></text><text x="558.8082191780823" y="215.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="558.8082191780823" dy="0">Himoya koʻzoynagi</tspan></text><rect x="30" y="229.0" width="900" height="39.75" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="255.1" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Osilgan kiyim, soch</tspan></text><text x="275.24657534246575" y="255.1" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.24657534246575" dy="0">Mexanizmga tortilish</tspan></text><text x="558.8082191780823" y="255.1" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="558.8082191780823" dy="0">Maxsus kiyim, bosh kiyim</tspan></text><rect x="30" y="268.75" width="900" height="39.75" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="294.85" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Mato changi</tspan></text><text x="275.24657