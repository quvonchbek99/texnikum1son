<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Andazani raqamlashtirish bosqichlari"><title>Andazani raqamlashtirish bosqichlari</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Andazani raqamlashtirish bosqichlari</tspan></text><g transform="translate(0 0.0)"><rect x="40" y="78.0" width="880" height="73.16666666666667" rx="12" fill="#fbe3dc"/><circle cx="80" cy="114.58333333333334" r="21" fill="#e4572e"/><text x="80" y="121.58333333333334" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">1</text><text x="116" y="122.58333333333334" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Andazani tekshirish</tspan></text><text x="380" y="111.58333333333334" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Yozuvlar, chok haqi, ip yoʻnalishi va kertiklar</tspan><tspan x="380" dy="22.5">aniqlanadi</tspan></text><rect x="40" y="163.16666666666669" width="880" height="73.16666666666667" rx="12" fill="#d9f0ed"/><circle cx="80" cy="199.75000000000003" r="21" fill="#1b998b"/><text x="80" y="206.75000000000003" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">2</text><text x="116" y="207.75000000000003" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Tayanch nuqtalar</tspan></text><text x="380" y="196.75000000000003" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Burchaklar, kesishuvlar va egri chiziq nuqtalari</tspan><tspan x="380" dy="22.5">belgilanadi</tspan></text><rect x="40" y="248.33333333333334" width="880" height="73.16666666666667" rx="12" fill="#dfe8f6"/><circle cx="80" cy="284.9166666666667" r="21" fill="#3d6fb6"/><text x="80" y="291.9166666666667" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">3</text><text x="116" y="281.9166666666667" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Oʻlchash yoki suratga</tspan><tspan x="116" dy="25.0">olish</tspan></text><text x="380" y="281.9166666666667" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Masofalar 1 mm aniqlikda yoki nazorat kvadrati bilan</tspan><tspan x="380" dy="22.5">surat</tspan></text><rect x="40" y="333.5" width="880" height="73.16666666666667" rx="12" fill="#fdf0d8"/><circle cx="80" cy="370.0833333333333" r="21" fill="#f2a541"/><text x="80" y="377.0833333333333" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">4</text><text x="116" y="378.0833333333333" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Konturni qurish</tspan></text><text x="380" y="378.0833333333333" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Nuqta, toʻgʻri va egri chiziq asboblari bilan chizma</tspan></text><rect x="40" y="418.6666666666667" width="880" height="73.16666666666667" rx="12" fill="#ece2f5"/><circle cx="80" cy="455.25" r="21" fill="#8e5bb5"/><text x="80" y="462.25" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">5</text><text x="116" y="463.25" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Detal yaratish</tspan></text><text x="380" y="463.25" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">Yopiq kontur, chok haqi, strelka, kertik va yorliq</tspan></text><rect x="40" y="503.83333333333337" width="880" height="73.16666666666667" rx="12" fill="#dcefe3"/><circle cx="80" cy="540.4166666666667" r="21" fill="#2f8f5b"/><text x="80" y="547.4166666666667" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">6</text><text x="116" y="548.4166666666667" text-anchor="start" font-size="20" font-weight="700" fill="#1d2b3a"><tspan x="116" dy="0">Tekshirish va saqlash</tspan></text><text x="380" y="548.4166666666667" text-anchor="start" font-size="18" font-weight="400" fill="#1d2b3a"><tspan x="380" dy="0">1:1 nusxa ±2 mm, loyiha fayli va DXF eksport</tspan></text></g></svg>