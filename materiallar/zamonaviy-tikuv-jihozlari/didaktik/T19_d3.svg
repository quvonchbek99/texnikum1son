<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Moylash usullari"><title>Moylash usullari</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Moylash usullari</tspan></text><g transform="translate(0 100.9)"><rect x="30" y="68.0" width="900" height="44.25" rx="8" fill="#1d2b3a"/><text x="41" y="97.9" text-anchor="start" font-size="21" font-weight="700" fill="#fff"><tspan x="41" dy="0">Usul</tspan></text><text x="321.64516129032256" y="97.9" text-anchor="start" font-size="21" font-weight="700" fill="#fff"><tspan x="321.64516129032256" dy="0">Qoʻllanishi</tspan></text><text x="660.3548387096773" y="97.9" text-anchor="start" font-size="21" font-weight="700" fill="#fff"><tspan x="660.3548387096773" dy="0">Nazorat</tspan></text><rect x="30" y="112.25" width="900" height="68.5" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="140.15" text-anchor="start" font-size="21" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Qoʻlda (moydon bilan)</tspan></text><text x="321.64516129032256" y="140.15" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="321.64516129032256" dy="0">Maishiy va ayrim sanoat</tspan><tspan x="321.64516129032256" dy="26.25">mashinalari</tspan></text><text x="660.3548387096773" y="140.15" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="660.3548387096773" dy="0">Har smena 1–2 tomchi</tspan></text><rect x="30" y="180.75" width="900" height="68.5" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="208.65" text-anchor="start" font-size="21" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Markazlashgan (karter,</tspan><tspan x="41" dy="26.25">nasos)</tspan></text><text x="321.64516129032256" y="208.65" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="321.64516129032256" dy="0">Moki chokli, overlok, kover</tspan></text><text x="660.3548387096773" y="208.65" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="660.3548387096773" dy="0">HIGH–LOW belgilari,</tspan><tspan x="660.3548387096773" dy="26.25">oynacha</tspan></text><rect x="30" y="249.25" width="900" height="68.5" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="277.15" text-anchor="start" font-size="21" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Minimal / quruq kallak</tspan></text><text x="321.64516129032256" y="277.15" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="321.64516129032256" dy="0">Och rangli, nozik matolar</tspan></text><text x="660.3548387096773" y="277.15" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="660.3548387096773" dy="0">Faqat pasportdagi</tspan><tspan x="660.3548387096773" dy="26.25">nuqtalar</tspan></text><rect x="30" y="317.75" width="900" height="68.5" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="345.65" text-anchor="start" font-size="21" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Bichuv mashinalari</tspan></text><text x="321.64516129032256" y="345.65" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="321.64516129032256" dy="0">Polzun, yoʻnaltiruvchilar</tspan></text><text x="660.3548387096773" y="345.65" text-anchor="start" font-size="21" font-weight="400" fill="#1d2b3a"><tspan x="660.3548387096773" dy="0">Pichoq va matoga moy</tspan><tspan x="660.3548387096773" dy="26.25">tegmasin</tspan></text></g></svg>