<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Nosozlik belgisi va asosiy sabablar"><title>Nosozlik belgisi va asosiy sabablar</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Nosozlik belgisi va asosiy sabablar</tspan></text><g transform="translate(0 110.0)"><rect x="30" y="68.0" width="900" height="39.25" rx="8" fill="#1d2b3a"/><text x="41" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="41" dy="0">Nosozlik</tspan></text><text x="257.86746987951807" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="257.86746987951807" dy="0">Belgisi</tspan></text><text x="518.1084337349398" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="518.1084337349398" dy="0">Asosiy sabab</tspan></text><rect x="30" y="107.25" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="131.55" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Yuqori ip uzilishi</tspan></text><text x="257.86746987951807" y="131.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Ip tez-tez uziladi</tspan></text><text x="518.1084337349398" y="131.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Notoʻgʻri oʻtkazish, ortiqcha taranglik</tspan></text><rect x="30" y="144.5" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="168.8" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Baxya tashlab ketish</tspan></text><text x="257.86746987951807" y="168.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Chokda baxya yetishmaydi</tspan></text><text x="518.1084337349398" y="168.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Egilgan igna, moki-igna tirqishi</tspan></text><rect x="30" y="181.75" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="206.05" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Pastda ilmoqlar</tspan></text><text x="257.86746987951807" y="206.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Ostki tomonda ilmoqlar</tspan></text><text x="518.1084337349398" y="206.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Yuqori ip boʻsh</tspan></text><rect x="30" y="219.0" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="243.3" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Chok burishishi</tspan></text><text x="257.86746987951807" y="243.3" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Mato tortilib qoladi</tspan></text><text x="518.1084337349398" y="243.3" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Iplar tarang, yoʻgʻon igna</tspan></text><rect x="30" y="256.25" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="280.55" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Igna sinishi</tspan></text><text x="257.86746987951807" y="280.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Igna sinadi</tspan></text><text x="518.1084337349398" y="280.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Matoni tortish, qalin joy</tspan></text><rect x="30" y="293.5" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="317.8" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Pichoq toʻmtoq</tspan></text><text x="257.86746987951807" y="317.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Chekka titiladi, eriydi</tspan></text><text x="518.1084337349398" y="317.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Charxlanmagan pichoq</tspan></text><rect x="30" y="330.75" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="355.05" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Tasma uzilishi</tspan></text><text x="257.86746987951807" y="355.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="257.86746987951807" dy="0">Tasma pichoq uziladi</tspan></text><text x="518.1084337349398" y="355.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="518.1084337349398" dy="0">Ortiqcha taranglik, sifatsiz payvand</tspan></text></g></svg>