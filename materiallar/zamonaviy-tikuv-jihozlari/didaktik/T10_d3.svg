<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Bichish nuqsonlari, sabablari va oldini olish"><title>Bichish nuqsonlari, sabablari va oldini olish</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Bichish nuqsonlari, sabablari va oldini olish</tspan></text><g transform="translate(0 84.2)"><rect x="30" y="68.0" width="900" height="41.75" rx="8" fill="#1d2b3a"/><text x="41" y="96.1" text-anchor="start" font-size="19" font-weight="700" fill="#fff"><tspan x="41" dy="0">Nuqson</tspan></text><text x="275.7826086956522" y="96.1" text-anchor="start" font-size="19" font-weight="700" fill="#fff"><tspan x="275.7826086956522" dy="0">Sababi</tspan></text><text x="608.3913043478261" y="96.1" text-anchor="start" font-size="19" font-weight="700" fill="#fff"><tspan x="608.3913043478261" dy="0">Oldini olish</tspan></text><rect x="30" y="109.75" width="900" height="63.5" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="135.85" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Pogʻonali qirqim</tspan></text><text x="275.7826086956522" y="135.85" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Qatlamlar siljigan, mashina</tspan><tspan x="275.7826086956522" dy="23.75">ogʻgan</tspan></text><text x="608.3913043478261" y="135.85" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Qisqichlar, mashinani tik</tspan><tspan x="608.3913043478261" dy="23.75">tutish</tspan></text><rect x="30" y="173.25" width="900" height="63.5" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="199.35" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Detal kattalashgan</tspan></text><text x="275.7826086956522" y="199.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Pichoq qiyshiq, chiziqdan</tspan><tspan x="275.7826086956522" dy="23.75">chiqqan</tspan></text><text x="608.3913043478261" y="199.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Pichoqni tekshirish, sekin</tspan><tspan x="608.3913043478261" dy="23.75">kesish</tspan></text><rect x="30" y="236.75" width="900" height="39.75" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="262.85" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Titilgan chet</tspan></text><text x="275.7826086956522" y="262.85" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Oʻtmas pichoq</tspan></text><text x="608.3913043478261" y="262.85" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Oʻz vaqtida charxlash</tspan></text><rect x="30" y="276.5" width="900" height="39.75" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="302.6" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Erib yopishgan chet</tspan></text><text x="275.7826086956522" y="302.6" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Sintetika, yuqori tezlik</tspan></text><text x="608.3913043478261" y="302.6" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Past tezlik, toʻlqinsimon tigʻ</tspan></text><rect x="30" y="316.25" width="900" height="39.75" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="342.35" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Chuqur kertik</tspan></text><text x="275.7826086956522" y="342.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Pichoq ortiqcha kiritilgan</tspan></text><text x="608.3913043478261" y="342.35" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Kertik 3–5 mm</tspan></text><rect x="30" y="356.0" width="900" height="63.5" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="382.1" text-anchor="start" font-size="19" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Qiyshiq tanda</tspan><tspan x="41" dy="23.75">yoʻnalishi</tspan></text><text x="275.7826086956522" y="382.1" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="275.7826086956522" dy="0">Andaza notoʻgʻri qoʻyilgan</tspan></text><text x="608.3913043478261" y="382.1" text-anchor="start" font-size="19" font-weight="400" fill="#1d2b3a"><tspan x="608.3913043478261" dy="0">Strelkani jiyakka parallel</tspan><tspan x="608.3913043478261" dy="23.75">qoʻyish</tspan></text></g></svg>