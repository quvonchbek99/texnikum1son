<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Sozlash qismlarini tekshirish nazorat varaqasi"><title>Sozlash qismlarini tekshirish nazorat varaqasi</title><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker><marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e4572e"/></marker></defs><text x="480" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#1d2b3a"><tspan x="480" dy="0">Sozlash qismlarini tekshirish nazorat varaqasi</tspan></text><g transform="translate(0 110.0)"><rect x="30" y="68.0" width="900" height="39.25" rx="8" fill="#1d2b3a"/><text x="41" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="41" dy="0">Qism</tspan></text><text x="341.0" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="341.0" dy="0">Nima tekshiriladi</tspan></text><text x="581.0" y="94.3" text-anchor="start" font-size="17" font-weight="700" fill="#fff"><tspan x="581.0" dy="0">Meʼyor</tspan></text><rect x="30" y="107.25" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="131.55" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Igna ushlagich vinti</tspan></text><text x="341.0" y="131.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Mahkamligi</tspan></text><text x="581.0" y="131.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Igna qimirlamaydi</tspan></text><rect x="30" y="144.5" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="168.8" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Igna plastinkasi</tspan></text><text x="341.0" y="168.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Vintlar, tirnalish</tspan></text><text x="581.0" y="168.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Sirt silliq, mahkam</tspan></text><rect x="30" y="181.75" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="206.05" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Reyka</tspan></text><text x="341.0" y="206.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Tishlar chiqishi</tspan></text><text x="581.0" y="206.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Bir tekis, ignaga tegmaydi</tspan></text><rect x="30" y="219.0" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="243.3" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Bosuvchi panja</tspan></text><text x="341.0" y="243.3" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Bosimi, parallelligi</tspan></text><text x="581.0" y="243.3" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Mato bir tekis suriladi</tspan></text><rect x="30" y="256.25" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="280.55" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Ip taranglagich</tspan></text><text x="341.0" y="280.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Chok muvozanati</tspan></text><text x="581.0" y="280.55" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Chirmashuv qatlamlar oʻrtasida</tspan></text><rect x="30" y="293.5" width="900" height="37.25" fill="#ffffff" stroke="#dccbb0" stroke-width="1"/><text x="41" y="317.8" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Chok uzunligi regulyatori</tspan></text><text x="341.0" y="317.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">1 sm dagi baxyalar</tspan></text><text x="581.0" y="317.8" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Texnologik xaritaga mos</tspan></text><rect x="30" y="330.75" width="900" height="37.25" fill="#fbf8f3" stroke="#dccbb0" stroke-width="1"/><text x="41" y="355.05" text-anchor="start" font-size="17" font-weight="600" fill="#1d2b3a"><tspan x="41" dy="0">Tormoz, ip qirqgich</tspan></text><text x="341.0" y="355.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="341.0" dy="0">Ishlashi</tspan></text><text x="581.0" y="355.05" text-anchor="start" font-size="17" font-weight="400" fill="#1d2b3a"><tspan x="581.0" dy="0">Aniq toʻxtaydi, ipni qirqadi</tspan></text></g></svg>